
defaults:
  - _self_
  - agent: sac
seeds: 5

env:
  robot: walker
  tasks: [run] #run, jump, stairs, hurdles
  discount: 0.99
  horizon: 500
  padding: False
  padding_size: 0
  exp_name: nominal_agent

net:
    network_type: nominal #nominal, parkour
    lr_actor: 3e-4
    lr_critic: 3e-4
    n_features: 256
    batch_size: 256
    tau: 0.005
    lr_alpha: 3e-4

exp:
  save : False
  save_fq: 5
  n_epochs: 100
  n_steps: 5000
  warmup_transitions: 3000
  initial_replay_size: 3000
  n_fits: 1
  use_cuda: True

logging:
  log: False
  project: Boosted_Parkour,
  group: GROUP_NAME,
  exp_name: EXP_NAME,